name: Validate pull request
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm run build
        working-directory: functions

  frontend:
    name: Frontend (test, build)
    runs-on: ubuntu-latest
    env:
      # Makes react-scripts treat lint/compile warnings as errors.
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --passWithNoTests
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  firebase:
    name: Firebase (dry-run deploy, hosting preview)
    needs: [functions, frontend]
    # Secrets aren't available to PRs from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Needed by the functions predeploy hooks (lint, build) and source analysis.
      - run: npm ci
        working-directory: functions
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      - run: npm install -g firebase-tools@15
      - name: Authenticate to Google Cloud
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUMB_AND_SHORT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"
      # Compiles Firestore rules server-side, checks indexes, analyzes functions
      # and checks required APIs, without changing anything.
      - name: Dry-run deploy
        run: firebase deploy --dry-run --non-interactive --project dumb-and-short
      - name: Deploy hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUMB_AND_SHORT }}
          projectId: dumb-and-short
