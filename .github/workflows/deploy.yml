name: Deploy to Firebase
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue them instead of cancelling.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy everything
    runs-on: ubuntu-latest
    env:
      # Makes react-scripts treat lint/compile warnings as errors.
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --passWithNoTests
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm install -g firebase-tools@15
      - name: Authenticate to Google Cloud
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUMB_AND_SHORT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"
      # Deploys hosting, functions, Firestore rules and indexes (everything in
      # firebase.json). --force deletes functions that are no longer in the
      # source and sets up the Artifact Registry cleanup policy without prompting.
      - name: Deploy
        run: firebase deploy --non-interactive --force --project dumb-and-short
